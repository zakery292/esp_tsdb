name: Release

# Pushing a tag like v2.2.0 creates a GitHub Release with the matching
# CHANGELOG.md section as notes, the packed component archive attached,
# and (if the IDF_COMPONENT_API_TOKEN secret is set) uploads the version
# to the ESP Component Registry under the zakery292 namespace.
#
# Release flow: merge to main -> bump idf_component.yml version + add a
# "## [X.Y.Z]" section to CHANGELOG.md -> git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
      PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches both manifests
        run: |
          manifest=$(grep -oP '^version:\s*"\K[^"]+' idf_component.yml)
          if [ "$manifest" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != idf_component.yml version ${manifest}. Bump it before tagging."
            exit 1
          fi
          # library.json is the PlatformIO manifest and carries its own copy of
          # the version. The registry refuses to re-publish an existing version,
          # so a stale value here fails the publish at the end of the job rather
          # than shipping the wrong number - catch it before anything is created.
          pio_manifest=$(python3 -c 'import json; print(json.load(open("library.json"))["version"])')
          if [ "$pio_manifest" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != library.json version ${pio_manifest}. Bump it before tagging."
            exit 1
          fi

      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" {f=1; next}
            /^## \[/ {f=0}
            f' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section for ${{ steps.ver.outputs.version }}; using auto-generated notes."
          fi

      - name: Pack component archive
        run: |
          pip install --quiet idf-component-manager
          compote component pack --name esp_tsdb --version "${{ steps.ver.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "${GITHUB_REF_NAME}")
          if [ -s release_notes.md ]; then
            args+=(--notes-file release_notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" \
            "dist/esp_tsdb_${{ steps.ver.outputs.version }}.tgz"

      - name: Upload to ESP Component Registry
        if: env.IDF_COMPONENT_API_TOKEN != ''
        run: |
          compote component upload --namespace zakery292 --name esp_tsdb \
            --version "${{ steps.ver.outputs.version }}"

      # PlatformIO consumers pin this component by git URL, which makes it
      # invisible to `pio pkg outdated` -- so a downstream project's dependency
      # scanner never reports a new esp_tsdb release. Publishing to the registry
      # lets them depend on a version spec and be told about updates instead.
      #
      # NB the namespace differs from the ESP Component Registry upload above:
      # PlatformIO namespaces a package by the publishing account, so this lands
      # under whoever owns PLATFORMIO_AUTH_TOKEN, not under zakery292. Skipped
      # entirely when the secret is unset, exactly like the upload above.
      - name: Publish to the PlatformIO Registry
        if: env.PLATFORMIO_AUTH_TOKEN != ''
        run: |
          pip install --quiet platformio
          pio pkg publish --type library --no-interactive --no-notify .
